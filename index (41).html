<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Agenda 🌸</title>

<script src="peeps.js"></script><script src="avatars.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf8f3;--card:#fff;--ink:#5b4b5e;--muted:#9a8a9e;--pink:#f4b6c8;--lav:#e3d6f5;--mint:#d3efe1;--line:#f3e4ea;--shadow:0 6px 24px rgba(201,138,165,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a22;--card:#2a232e;--ink:#f0e6f2;--muted:#b3a2b8;--line:#3a3140;--lav:#3b3250;--mint:#27403a;--shadow:0 6px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1a22;--card:#2a232e;--ink:#f0e6f2;--muted:#b3a2b8;--line:#3a3140;--lav:#3b3250;--mint:#27403a;--shadow:0 6px 24px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Quicksand,system-ui,sans-serif;line-height:1.5}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0}
.wrap{max-width:1000px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header h1{font-size:2rem}.sub{color:var(--muted);font-size:.95rem}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
button,select,input,textarea{font:inherit;color:var(--ink)}
.btn{border:0;border-radius:999px;padding:9px 18px;background:var(--lav);cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn.on,.btn.main{background:var(--pink);color:#4a3b4e;font-weight:600}
.btn.del{background:#f9d4d4;color:#7a3b3b}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.stat{font-family:"Cormorant Garamond",serif;font-size:2.6rem;color:var(--stat,#c98aa5);line-height:1}
.chip{border-radius:10px;padding:3px 8px;margin:2px 0;font-size:.8rem;color:#4a3b4e;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.completado{text-decoration:line-through;opacity:.55}.chip.cancelado{opacity:.4;text-decoration:line-through}
.chip.rem{border:1px dashed var(--pink);color:var(--ink)}
.ck{width:20px;height:20px;padding:0;accent-color:var(--pink);flex:none;margin-top:3px;cursor:pointer}
.tm{width:92px;flex:none;font-size:.85rem;color:var(--muted);padding-top:2px}
.dn b{text-decoration:line-through;opacity:.6}
.ava{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--pink);flex:none;cursor:pointer;background:var(--lav)}.ava.big{width:104px;height:104px;border:3px solid var(--pink);box-shadow:var(--shadow),0 0 0 6px var(--lav)}.ava.mid{width:64px;height:64px;cursor:default;margin-bottom:6px}
.hello{display:flex;gap:20px;align-items:center}.hello .who{text-align:center;flex:none}.hello .who small{display:block;margin-top:10px;color:var(--muted);font-size:.72rem;letter-spacing:.04em;max-width:112px}
.bubble{position:relative;margin-top:12px;background:var(--lav);border-radius:18px;padding:12px 16px;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.2rem;font-style:italic}.bubble:before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-left:0;border-right-color:var(--lav)}
@media(max-width:560px){.hello{flex-direction:column;text-align:center}.bubble:before{left:50%;top:-8px;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--lav)}}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0}.pk{border:3px solid transparent;border-radius:50%;padding:0;background:none;cursor:pointer;aspect-ratio:1;transition:transform .15s}.pk img{width:100%;height:100%;border-radius:50%;display:block}.pk:hover{transform:scale(1.05)}.pk.on{border-color:var(--pink);box-shadow:0 0 0 3px var(--lav)}

.quote{margin-top:10px;background:var(--lav);border-radius:14px;padding:10px 14px;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.15rem;font-style:italic}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;--mx:0;--my:0}
#bg .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
#bg .b1{width:380px;height:380px;background:var(--lav);top:-80px;left:-80px}#bg .b2{width:420px;height:420px;background:var(--blob2,#f9d9e5);bottom:-120px;right:-100px}#bg .b3{width:300px;height:300px;background:var(--mint);top:45%;left:55%;opacity:.35}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #bg .b2{background:var(--blob2,#4a2f45)}}
#bg .fig{position:absolute;bottom:0;height:62vh;max-height:560px;opacity:.14;transition:transform .4s ease-out;display:none}
#bg .fl{left:max(0px,calc(50% - 760px));transform:translate(calc(var(--mx)*16px),calc(var(--my)*8px))}
#bg .fr{right:max(0px,calc(50% - 760px));transform:translate(calc(var(--mx)*-16px),calc(var(--my)*8px))}
@media(min-width:1280px){#bg .fig{display:block}}
.petal{position:absolute;top:-30px;opacity:.5;animation:fall linear infinite;will-change:transform}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}50%{transform:translate(40px,55vh) rotate(180deg)}100%{transform:translate(-20px,112vh) rotate(360deg)}}
.wrap{position:relative;z-index:1;padding-bottom:170px}
#comp{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:0;z-index:4;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none}
#cimg{height:190px;cursor:pointer;pointer-events:auto;filter:drop-shadow(0 6px 12px rgba(120,80,140,.28));transform-origin:50% 100%;animation:bob 5s ease-in-out infinite;transition:opacity .25s,transform .25s}
#cimg.swap{opacity:0;transform:translateY(24px)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-1deg)}}
#cbub{pointer-events:auto;cursor:pointer;max-width:240px;margin:0 6px -4px 0;background:var(--card);border:1px solid var(--pink);border-radius:16px;padding:10px 14px;font-size:.88rem;box-shadow:var(--shadow);opacity:0;transform:translateY(8px) scale(.96);transition:.3s;position:relative;visibility:hidden}
#cbub.show{opacity:1;transform:none;visibility:visible}
#cbub:after{content:"";position:absolute;bottom:-8px;right:46px;border:8px solid transparent;border-bottom:0;border-top-color:var(--pink)}
.fly{position:fixed;z-index:8;pointer-events:none;font-size:20px;animation:fly 1.5s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.mini{width:30px;height:30px;border-radius:50%;border:2px solid;flex:none;background:var(--lav);object-fit:cover}
.tod{width:20px;height:20px;border-radius:50%;margin-left:4px;vertical-align:middle;border:1.5px solid var(--pink);background:var(--lav)}.day.mini .tod{width:15px;height:15px;margin:0 0 0 2px}
@media(max-width:700px){#cimg{height:120px}#cbub{max-width:190px;font-size:.8rem}}
@media (prefers-reduced-motion:reduce){#cimg{animation:none}.petal{display:none}}
.capf::first-letter{text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dh{text-align:center;color:var(--muted);font-size:.8rem}
.day{min-height:92px;background:var(--bg);border-radius:12px;padding:4px;cursor:pointer;overflow:hidden}
.day.mini{min-height:38px;text-align:center}.day.out{opacity:.4}.day.today{outline:2px solid var(--pink)}
.day b{font-size:.8rem}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.pill{width:10px;height:10px;border-radius:50%;flex:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;width:100%}
.bar input,.bar select{width:auto;flex:1;min-width:130px}
#modal{position:fixed;inset:0;background:rgba(60,40,70,.4);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
#modal.open{display:flex}.sheet{background:var(--card);border-radius:24px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 3px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.95rem}.chk input{width:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);border:1px solid var(--pink);padding:10px 20px;border-radius:999px;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1}.warn{background:var(--lav);border-radius:14px;padding:10px 14px;font-size:.85rem;margin-bottom:14px}
.empty{text-align:center;color:var(--muted);padding:18px}
.qa{display:flex;gap:8px;margin:0 0 4px}.qa input{flex:1;min-width:0;border-radius:999px;padding:10px 16px;border:1.5px solid var(--pink)}
#qa_prev{min-height:22px;margin:0 6px 10px;font-size:.85rem;color:var(--ink)}#qa_prev .qp{background:var(--lav);border-radius:999px;padding:3px 12px;display:inline-block}
.warnc{background:#fdecc8;color:#7a5a1a;border-radius:10px;padding:3px 10px;font-size:.82rem;margin-top:4px}
:root[data-theme="dark"] .warnc{background:#4a3d1c;color:#f3dca0}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .warnc{background:#4a3d1c;color:#f3dca0}}
.gaps{margin-top:8px;font-size:.88rem;color:var(--muted)}.gap{border:1px dashed var(--pink);background:transparent;border-radius:999px;padding:2px 10px;margin:2px 3px;cursor:pointer;color:var(--ink)}.gap:hover{background:var(--lav)}
.subs{margin-top:6px;display:flex;flex-direction:column;gap:2px}.sub-i{display:flex;gap:6px;align-items:center;font-size:.9rem;cursor:pointer;margin:0;color:var(--ink)}.sub-i input{width:auto;accent-color:#f4b6c8}.sub-i.dn{text-decoration:line-through;opacity:.6}
.dz{outline:2px dashed var(--pink);outline-offset:-2px;background:var(--lav)}.chip[draggable=true]{cursor:grab}
.si{display:flex;gap:6px;align-items:center;margin:4px 0}.si .ck{margin-top:0}.sit{flex:1;min-width:0}.btn.xs{padding:4px 10px}
.pbar{height:10px;background:var(--lav);border-radius:99px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--stat,#c98aa5));border-radius:99px;transition:width .5s}
.moodbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.mb{font-size:1.7rem;line-height:1;border:2px solid transparent;border-radius:16px;background:var(--lav);padding:8px 10px;cursor:pointer;transition:transform .15s}.mb:hover{transform:scale(1.12)}.mb.on{border-color:var(--pink);background:var(--card);box-shadow:var(--shadow)}
.garden{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.gc{background:var(--bg);border-radius:12px;min-height:54px;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border:2px solid transparent;font:inherit;color:var(--ink)}.gc small{font-size:.65rem;color:var(--muted);align-self:flex-start}.gc span{font-size:1.5rem;line-height:1.1;animation:pop .5s ease-out}
.gc.today{border-color:var(--pink)}.gc.fut{opacity:.55}.gc.mc{cursor:pointer;min-height:44px}.gc.mc.sel{background:var(--lav)}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.hb{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.hb:last-of-type{border:0}
.hbtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--pink);background:var(--card);font-size:1.3rem;cursor:pointer;flex:none}.hbtn.on{background:var(--pink);color:#4a3b4e;font-weight:700}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:6px}
.dt{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--lav);margin-right:3px}.dt.on{background:var(--stat,#c98aa5)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}.bdg{text-align:center;background:var(--bg);border-radius:14px;padding:8px 4px;opacity:.55;filter:grayscale(.7)}.bdg span{font-size:1.6rem;display:block}.bdg small{font-size:.72rem;line-height:1.2;display:block}.bdg.on{opacity:1;filter:none;border:1px solid var(--pink);background:var(--card)}
body[data-tod=morning] #bg .b1{background:#fde7c8}body[data-tod=dusk] #bg .b2{background:#f6c4d6}body[data-tod=dusk] #bg .b1{background:#d8c2f2}body[data-tod=night] #bg .b1{background:#b9aee6}body[data-tod=night] #bg .b3{background:#9fb8e6}
.day.mini{width:auto;height:auto;border:0;border-radius:12px;background:var(--bg);object-fit:initial}.day.mini.today{outline:2px solid var(--pink)}
#asst{position:fixed;right:12px;bottom:200px;width:min(380px,calc(100vw - 24px));height:min(520px,calc(100vh - 225px));background:var(--card);border:1px solid var(--pink);border-radius:22px;box-shadow:0 12px 40px rgba(120,80,140,.3);z-index:7;display:none;flex-direction:column;overflow:hidden}#asst.open{display:flex}
#asst .ah{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--lav)}#asst .ah img{height:44px;border-radius:50%;background:var(--card);width:44px;object-fit:cover;object-position:top}#asst .ah>div{flex:1}#asst .ah .x{font-size:1.1rem}
#amsgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.am{max-width:88%;padding:8px 12px;border-radius:16px;font-size:.92rem;line-height:1.45;word-wrap:break-word}.am.a{background:var(--lav);align-self:flex-start;border-bottom-left-radius:4px}.am.u{background:var(--pink);color:#4a3b4e;align-self:flex-end;border-bottom-right-radius:4px}.al{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--pink)}
#asug{padding:0 10px 4px;display:flex;flex-wrap:wrap}.af{display:flex;gap:6px;padding:8px 10px 10px}.af input{flex:1;min-width:0}
@media(max-width:700px){#asst{bottom:130px;height:min(520px,calc(100vh - 150px))}}

/* ===== v6: diseño limpio ===== */
:root{--accent:#d98aa8}
body{font-size:15.5px}
header{margin-bottom:10px}header h1{font-size:1.7rem;line-height:1.1}
.okdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6fcf97;margin-right:6px;vertical-align:middle}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
nav{display:inline-flex;gap:2px;background:var(--lav);padding:4px;border-radius:999px;margin:0;flex:none;max-width:100%;overflow-x:auto}
nav .btn{background:transparent;padding:7px 14px;font-weight:500}nav .btn.on{background:var(--card);box-shadow:0 1px 4px rgba(120,80,140,.18)}
.qa{flex:1;min-width:220px;margin:0}.qa input{padding:8px 14px;border:1px solid var(--line);background:var(--card)}.qa input:focus{border-color:var(--pink);outline:none}.qa .btn{background:var(--lav)}
#qa_prev{min-height:0;margin:2px 4px 8px}#qa_prev:empty{display:none}
.card{border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(120,80,100,.05),0 8px 24px rgba(201,138,165,.08)}
h3{font-size:1.2rem}.hero h2{font-size:2rem;line-height:1.15;margin:2px 0 6px}.quote2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.15rem;color:var(--muted)}
.btn{padding:8px 16px;font-size:.93rem}
.cbar{width:4px;align-self:stretch;min-height:28px;border-radius:4px;flex:none;background:var(--pink)}
.row.r2{gap:10px;justify-content:flex-start}.row.r2>.sub{margin-left:auto;flex:none}
.dayh{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.05rem;color:var(--accent);margin:14px 0 2px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:2px}.dayh:first-of-type{margin-top:4px}
.chip{color:var(--ink);border-radius:6px;padding:2px 6px;margin:2px 0;font-size:.78rem}.chip b{font-weight:600}
.chip.rem{background:transparent!important;border:1px dashed var(--pink)}
.day{background:transparent;border:1px solid var(--line);border-radius:12px}.day.out{opacity:.35}.day.today{outline:0;background:var(--bg)}
.day.today>b{background:var(--pink);color:#4a3b4e;border-radius:99px;padding:1px 7px}.day.mini.today>b{padding:0 5px}
.day.mini{border:0;background:var(--bg)}.day.mini.today{outline:2px solid var(--pink)}

.t24{display:flex;gap:4px;align-items:center}.t24 select{flex:1;width:auto;min-width:0;padding:8px 6px}

/* ===== v9: ajustes con pestañas, avatares, paletas, avisos, administración ===== */
.stabs{display:flex;gap:4px;margin:10px 0 12px;background:var(--bg);padding:4px;border-radius:999px;border:1px solid var(--line);position:sticky;top:-20px;z-index:2}
.stab{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.stab.on{background:var(--pink);color:#4a3b4e;font-weight:600}
@media(max-width:430px){.stab{font-size:.74rem;padding:7px 2px}}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin:10px 0}

async function adminDo(id,a){const o=$('#adout');o.innerHTML='<p class="sub">Un momento…</p>';try{const d=await admCall(a,id,a==='temp_password'?($('#adpw')||{}).value:'');
 if(a==='temp_password')o.innerHTML=`<div class="alsum"><b>Contraseña nueva de ${esc(d.email)}:</b><br><code id="adv" style="font-size:1.3rem">${esc(d.password)}</code> <button class="btn" onclick="admCopy()">Copiar</button><div class="sub">Díselo por un canal privado. Ya está activa (la anterior dejó de servir) y puede cambiarla en Ajustes → Perfil.</div></div>`;
 else o.innerHTML=`<div class="alsum"><b>${a==='reset_link'?'Enlace para elegir una contraseña nueva':'Enlace para entrar como '+esc(d.email)}:</b><div class="adlink" id="adv">${esc(d.token_hash?APP_URL()+'#adm='+d.type+'.'+d.token_hash:d.link)}</div><button class="btn" onclick="admCopy()">Copiar enlace</button>${a==='enter_link'?' <button class="btn" onclick="window.open($(\'#adv\').textContent)">Abrir</button>':''}<div class="sub">${a==='reset_link'?'Un solo uso. Mándaselo y, al abrirlo, elegirá su contraseña nueva.':'Un solo uso. Ábrelo en una ventana privada para no cerrar tu sesión. Verás la agenda como la ve esa persona y podrás ayudarle; lo que cambies queda cambiado.'}</div></div>`}catch(e){o.innerHTML=`<div class="warn">No se pudo: ${esc(e.message)}</div>`}}
function admCopy(){const t=$('#adv').textContent;const f=()=>{const r=document.createRange();r.selectNodeContents($('#adv'));getSelection().removeAllRanges();getSelection().addRange(r);toast('Selecciónalo y copia (Ctrl+C)')};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Copiado'),f);else f()}
async function adminView(id){const u=ADM.find(x=>x.user_id===id);modal(`<h2>👁️ Agenda de ${esc((u&&(u.name||u.email))||'')}</h2><p class="sub">Cargando…</p>`);
 try{const d=await admCall('view',id),ev=(d.events||[]).map(fromRow),t=today(),lim=iso(add(new Date(),-30)),cnt=s=>ev.filter(e=>e.status===s).length;
  const up=ev.filter(e=>e.date>=t&&e.status==='pendiente').sort((a,b)=>a.date.localeCompare(b.date)||(a.st||'').localeCompare(b.st||'')).slice(0,60),re=ev.filter(e=>e.date<t&&e.date>=lim).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
  const line=e=>`<div class="adev ${e.status==='cancelado'?'cx':''}"><span>${fmt(e.date)}${e.st?' · '+e.st:''}</span><span style="flex:1"><b>${esc(e.title)}</b>${e.loc?' <span class="sub">('+esc(e.loc)+')</span>':''} <span class="sub">${esc(e.cat)}</span></span><span>${e.status==='completado'?'✓':e.status==='cancelado'?'✕':''}</span></div>`;
  const pf=d.profile||{};
  modal(`<h2>👁️ Agenda de ${esc(pf.name||d.email)}</h2><p class="sub">${esc(d.email)} · Solo lectura · Último acceso: ${admAgo(d.last_sign_in_at)}</p>
<div class="adst"><div><b>${ev.length}</b><span>Eventos</span></div><div><b>${cnt('pendiente')}</b><span>Pendientes</span></div><div><b>${cnt('completado')}</b><span>Hechos</span></div><div><b>${cnt('cancelado')}</b><span>Cancelados</span></div></div>
<p class="sub">Zona: ${esc(pf.timezone||'—')} · Avisos por correo: ${pf.notify_email===false?'no':'sí'} · Avatar: ${esc(parsePhoto(pf.photo).id)}</p>
<h3 style="margin-top:12px">Próximos (${up.length})</h3>${up.map(line).join('')||'<div class="empty">Nada próximo</div>'}
<h3 style="margin-top:12px">Últimos 30 días</h3>${re.map(line).join('')||'<div class="empty">Nada reciente</div>'}
<div class="bar" style="margin-top:14px"><button class="btn" onclick="adminUser('${id}')">‹ Volver</button><button class="btn" onclick="closeM()">Cerrar</button></div>`)}
 catch(e){modal(`<h2>👁️ Agenda</h2><div class="warn">No se pudo cargar: ${esc(e.message)}</div><div class="bar" style="margin-top:12px"><button class="btn" onclick="adminUser('${id}')">‹ Volver</button></div>`)}}
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){window.__recov=1;if(S)setTimeout(recoveryModal,300)}});
function recoveryModal(){window.__recov=0;modal(`<h2>🔑 Elige tu contraseña nueva</h2><p class="sub">Escribe una contraseña nueva de 8 o más caracteres.</p><label>Contraseña nueva</label><input type="password" id="rc_pw" autocomplete="new-password"><div class="bar" style="margin-top:14px"><button class="btn main" onclick="recoverySave()">Guardar contraseña</button></div><div class="sub" id="rc_msg" style="margin-top:8px"></div>`)}
async function recoverySave(){const v=$('#rc_pw').value;if(v.length<8)return $('#rc_msg').textContent='Mínimo 8 caracteres';const r=await sb.auth.updateUser({password:v});if(r.error)return $('#rc_msg').textContent='Error: '+r.error.message;closeM();toast('Contraseña cambiada ✨')}
async function changePw(){const i=$('#s_pw'),v=i.value;if(v.length<8)return toast('Mínimo 8 caracteres');const r=await sb.auth.updateUser({password:v});if(r.error)return toast('Error: '+r.error.message);i.value='';toast('Contraseña cambiada ✨')}
async function accLog(){const o=$('#s_log');if(!o||!U)return;const r=await sb.from('admin_access_log').select('action,created_at').eq('target_id',U.id).order('created_at',{ascending:false}).limit(5);if(r.error||!r.data)return;o.innerHTML=r.data.length?'<b>Accesos de soporte del administrador:</b> '+r.data.map(x=>new Date(x.created_at).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · '+esc(x.action)).join(' — '):'Sin accesos del administrador a tu cuenta.'}

async function admHashLogin(){try{const m=/#adm=(recovery|magiclink)\.([\w-]+)/.exec(location.hash);if(!m)return;history.replaceState(null,'',location.pathname+location.search);let r=await sb.auth.verifyOtp({token_hash:m[2],type:m[1]});if(r.error&&m[1]==='magiclink')r=await sb.auth.verifyOtp({token_hash:m[2],type:'email'});if(!r.error&&m[1]==='magiclink')try{sessionStorage.setItem('adm_as','1')}catch{};if(r.error)window.__admErr='El enlace ya se usó o ha caducado. Pide uno nuevo a la administradora.'}catch(e){window.__admErr='No se pudo abrir el enlace.'}}

function admBar(){try{if(!U||!sessionStorage.getItem('adm_as')||$('#admbar'))return;const b=document.createElement('div');b.id='admbar';b.innerHTML='<span>🛡️ Estás dentro como <b></b> (modo administradora)</span><button type="button" class="btn xs" onclick="try{sessionStorage.removeItem(\'adm_as\')}catch{};logout()">Salir</button>';b.querySelector('b').textContent=U.email||'';document.body.appendChild(b)}catch{}}
setInterval(admBar,1500);

bgInit();
boot();
</script></body></html>
